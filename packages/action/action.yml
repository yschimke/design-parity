name: "Design parity"
description: "Check a UI pull request against its design reference (comment mode) and publish always-current parity artifacts on every push to the development branch (baseline mode)."
author: "design-parity"

inputs:
  github_token:
    description: >
      Token for the Action. In comment mode it reads the PR's changed files and
      posts/updates the verdict comment. In baseline mode it force-updates the
      artifact branch, so the workflow must grant `contents: write`.
    default: ${{ github.token }}
  candidates:
    description: "Repo-relative path to a CandidateRender[] JSON for the components (produced by a prior compose-preview step)."
    required: false
  candidate_bundles:
    description: "Comma-separated compose-preview bundle inputs (polyglot .png files and/or directories of them) to read candidate renders from. Combined with `candidates` (bundles win, JSON is the fallback)."
    required: false
  development_branch:
    description: "Long-lived branch whose pushes flip the Action into baseline mode (publishing artifacts). PRs run in comment mode regardless."
    default: "main"
  artifact_branch:
    description: "Permanent branch the rendered parity artifacts (index.html + per-component report.html + verdict.json) are force-published to in baseline mode. Defaults to `design-parity/<development_branch>`."
    required: false
  mode:
    description: "Override the event-based mode selector: `auto` (default), `baseline`, `comment`, or `skip`."
    default: "auto"
  push_back:
    description: >
      Opt in to Code-to-Canvas push-back (issue #9): after a parity run, push the
      candidate render back into the design file. A no-op (logged) unless this is
      truthy AND the resolved direction is `code-led` AND the component's source
      is `figma` — in `design-led` the design stays canonical and code is never
      pushed back. Requires `canvas_endpoint` to actually write.
    default: "false"
  canvas_endpoint:
    description: >
      Code-to-Canvas bridge endpoint (a Figma plugin / Dev Mode hook) that
      accepts the candidate PNG + target node. The Figma REST API is read-only,
      so push-back has no transport without this; falls back to the
      `FIGMA_CANVAS_ENDPOINT` env var.
    required: false
  canvas_token:
    description: "Bearer token for the Code-to-Canvas bridge. Falls back to `FIGMA_CANVAS_TOKEN`, then `FIGMA_OAUTH_TOKEN`."
    required: false

runs:
  using: "node20"
  main: "dist/cli/action.js"

# Note: publishing this as a usable action requires the bundled `dist/` to be
# committed (e.g. via `ncc` into a single file). That bundling step is a
# follow-up; today the orchestrator + surface ship as the npm package and CLI.
branding:
  icon: "check-circle"
  color: "purple"
