name: design-parity (reusable)

# The sharded parity run, as a reusable workflow a consumer repo calls.
#
# WHY THIS EXISTS. A parity run costs roughly `fixed + per_component × components`.
# The fixed part is the candidate render's Gradle configure + compile (~4 min,
# paid whether one preview is drawn or a thousand); the marginal part is one
# render + reference fetch + diff per component. Past a few hundred components
# the marginal part dominates and a single job walks into its own timeout.
#
# Two different costs get confused here, so name them separately.
#
# SCOPING THE RENDER is not optional and costs no coverage. A catalog module
# draws far more previews than any component maps to (m3-catalog: 1,095 drawn,
# 77 mapped), and only mapped components are ever compared — so excluding the
# unmapped previews from the render removes work nobody was going to look at.
# yschimke/m3-catalog#11 did this by hand and took its render from ~43 min to
# ~4. This workflow derives that same exclusion instead, from the discovery
# manifest (`preview-manifest`), so the list is never hand-maintained.
#
# SHARDING divides what is left. Even correctly scoped, the marginal cost grows
# with the mapped set; N jobs each render and compare a disjoint slice of the
# SAME exhaustive component list, and `design-parity merge` unions the slices
# into the artifact set one serial run would have produced.
#
# Scoping first, then shard if the scoped run is still too slow — `shards: 1`
# with a correct `preview-manifest` is a complete answer for most catalogs, and
# it is the one that does not multiply the reference API's rate limit by N.
#
# WHAT DIVIDES AND WHAT DOESN'T. Only the marginal cost divides — every shard
# pays the fixed cost in full — so 4–8 is the useful range and a large fleet is
# buying Gradle configure time, not throughput. See docs/PARALLEL_PARITY.md for
# the arithmetic and how to pick a number.
#
# THE ONE INVARIANT. Each shard's render and its comparison must select the same
# components, or the shard renders previews it never diffs and diffs components
# it never rendered — which surfaces only as "no candidate render available"
# warnings on a green run. Both sides therefore read the partition from the same
# place: `design-parity shard --shard i/N`. Neither re-derives it.
#
# Usage (the whole consumer-side workflow):
#
#   jobs:
#     parity:
#       uses: yschimke/design-parity/.github/workflows/design-parity-reusable.yml@main
#       permissions:
#         contents: write
#       with:
#         module: ':catalog'
#         shards: 6
#         design-map-command: ./gradlew :catalog:composePreviewDiscover && node scripts/generate-design-map.mjs
#       secrets:
#         figma-token: ${{ secrets.FIGMA_TOKEN }}

on:
  workflow_call:
    inputs:
      module:
        description: "Gradle module holding the @Preview functions, e.g. ':catalog'."
        required: true
        type: string
      shards:
        description: >
          Split the run across this many parallel jobs. 1 (the default) is a
          single job doing exactly what a serial run does — no artifacts, no
          merge — so a small catalog pays nothing for this workflow's existence.

          Above 1, each shard renders and compares its own slice and the merge
          reassembles them. Only the marginal cost divides (see the header), so
          4–8 is the useful range. More shards than components is allowed: the
          tail shards no-op rather than failing.
        required: false
        type: number
        default: 1
      design-map-command:
        description: >
          Shell run before the partition, to regenerate `design-map.json` from
          the repo (e.g. a discovery pass that projects the map out of
          `@CatalogComponent(reference = …)` annotations). Empty means the
          committed map is used as-is. Runs in every shard: it is cheap next to
          the render, and the partition must be derived from the same map the
          comparison will use.
        required: false
        type: string
        default: ""
      components:
        description: >
          Comma-separated component handles to compare. Empty (the default) means
          EVERY component in `design-map.json` — the exhaustive run this workflow
          exists to make affordable. Set it only to deliberately narrow the run.
        required: false
        type: string
        default: ""
      preview-manifest:
        description: >
          Path to the `compose-preview` discovery manifest listing EVERY preview
          the module can draw (`previews.json`), or a newline-delimited id list.
          Empty (the default) derives it from `module`:
          `:a:b` ⇒ `a/b/build/compose-previews/previews.json`.

          This is what scopes the render. `--exclude-preview-id` is built as
          "everything in this file, minus what this shard compares", so a module
          holding previews no component maps to (the normal case for a catalog:
          m3-catalog draws 1,095 and maps 77) still renders only the slice. If
          the file is absent the render is NOT scoped — every shard draws the
          whole module — so the run warns loudly rather than silently paying it.
        required: false
        type: string
        default: ""
      design-parity-version:
        description: "npm version of the `design-parity` CLI to run (must be >= the release carrying `merge`)."
        required: false
        type: string
        default: "latest"
      cache-paths:
        description: >
          Space-separated paths whose content decides whether a run would
          reproduce the published board — the module, the version catalog, the
          build files. When they and the reference file are unchanged and the
          tool is the same version, the run is skipped and the previous verdict
          re-applied. Empty (the default) disables the short-circuit: a caller
          has to say what feeds its render, because a wrong list produces a
          stale skip, which is worse than never skipping.
        required: false
        type: string
        default: ""
      force-refresh:
        description: >
          Ignore the cache and run regardless. The key cannot cover everything
          that moves — a runner image, a font, a renderer's own transitive deps
          — so a scheduled unconditional run is the companion to caching, not an
          optional extra.
        required: false
        type: boolean
        default: false
      design-parity-ref:
        description: >
          Test an UNRELEASED design-parity: a git ref of yschimke/design-parity
          to build and run instead of the published `design-parity-version`.
          The whole monorepo is checked out and built, so the run exercises the
          `@design-parity/*` workspaces at that ref — a fix in an adapter is
          reachable, which it is not from a tarball of the launcher alone.
          Empty (the default) runs the published CLI. Pair it with a `uses:` ref
          on this workflow to test a change to the pipeline itself.
        required: false
        type: string
        default: ""
      compose-preview-version:
        description: "Version passed to the compose-ai-tools install action. `catalog` resolves the pin from the version catalog."
        required: false
        type: string
        default: "catalog"
      catalog-key:
        description: "Version-catalog key the compose-preview pin lives under, when `compose-preview-version: catalog`."
        required: false
        type: string
        default: "composePreviewPlugin"
      artifact-branch:
        description: "Long-lived branch the merged artifacts are published to. Empty disables publishing (the run still comments its verdict via the exit code)."
        required: false
        type: string
        default: "design-parity/main"
      reference-cache-branch:
        description: >
          Branch holding the committed reference cache that
          `design-parity-import-reusable.yml` maintains. When set, the run reads
          its references from there and makes **no Figma calls at all** — no rate
          limit, no network flake, and a diff that is reproducible because the
          reference is pinned rather than re-fetched (issue #289).

          Empty (the default) keeps the old behaviour: every shard fetches every
          reference it needs, live, on every run. That is what truncates a
          catalog-sized run — 18 of 77 components was the observed figure — so
          set this on anything bigger than a handful of components.

          The cache is authoritative when set: a component the import has not
          reached yet is reported as a cache miss on that component, not
          silently fetched behind your back. Missing rows are visible; run the
          import to fill them.
        required: false
        type: string
        default: ""
      render-timeout:
        description: "Seconds `bundle pack` may spend rendering, per shard. This is the INNER timeout; keep `timeout-minutes` above it."
        required: false
        type: number
        default: 2400
      desktop-render:
        description: "Install Mesa/Xvfb and render under xvfb-run — required by the desktop (Skiko) render daemon."
        required: false
        type: boolean
        default: true
      gradle-cache-read-only:
        description: >
          Keep the shards from writing the Gradle cache. Default `true`: the
          fan-out reads one warm entry rather than N jobs racing to write it,
          and a run reachable from a fork must never write it. Set `false` in a
          trusted push-triggered run that should refresh the cache.
        required: false
        type: boolean
        default: true
      java-version:
        description: "Temurin JDK version for the render."
        required: false
        type: string
        default: "21"
      node-version:
        description: "Node version for the parity run."
        required: false
        type: string
        default: "24"
      runs-on:
        description: "Runner label for every job."
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: "Per-shard job timeout. A shard does the fixed setup plus its slice, so this is sized for one slice, not the whole run."
        required: false
        type: number
        default: 60
    secrets:
      figma-token:
        description: "Read-only Figma PAT with `file_content:read`. Absent ⇒ the parity step is skipped with a warning rather than failing."
        required: false

permissions: {}

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Turns the shard count into a matrix (Actions has no range expression) and
  # probes the CLI *before* anything expensive starts. The probe is not
  # ceremony: the merge runs LAST, after every shard has spent its full budget,
  # so a CLI predating `merge` would fail with "unknown subcommand" having burned
  # the entire fan-out. `design-parity-version` defaults to `latest`, but a
  # consumer pinning an older version is exactly the case that hits this.
  # ── Would this run reproduce the board that is already published? ──────────
  # A parity run is a pure function of the code, the renderer, the references,
  # the map joining them, the policy and the tool. When none moved, rebuilding
  # the board costs a full render and a reference fetch to arrive back where the
  # branch already is. Roughly 40s to find that out, against ~10 minutes to
  # rediscover it the long way.
  cache:
    name: Check the inputs moved
    if: ${{ inputs.cache-paths != '' && inputs.artifact-branch != '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      key: ${{ steps.decide.outputs.key }}
      blocked: ${{ steps.decide.outputs.blocked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Check out design-parity@${{ inputs.design-parity-ref }}
        if: ${{ inputs.design-parity-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: ${{ inputs.design-parity-ref }}
          path: .design-parity-src

      - name: Build design-parity from source
        if: ${{ inputs.design-parity-ref != '' }}
        working-directory: .design-parity-src
        run: |
          set -euo pipefail
          npm ci --silent
          npm run build --silent

      - name: Fetch the previous board
        id: previous
        env:
          BRANCH: ${{ inputs.artifact-branch }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch "$BRANCH" "$repo" previous 2>/dev/null; then
            rm -rf previous/.git
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: decide
        env:
          FIGMA_TOKEN: ${{ secrets.figma-token }}
          DP_VERSION: ${{ inputs.design-parity-version }}
          DP_REF: ${{ inputs.design-parity-ref }}
          CACHE_PATHS: ${{ inputs.cache-paths }}
          FORCE: ${{ inputs.force-refresh }}
          REFERENCE_CACHE_BRANCH: ${{ inputs.reference-cache-branch }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          parts=()

          # The code side: a git tree hash per named path. Exact — it moves iff a
          # tracked file under it moves — and free, unlike hashing the tree here.
          for path in $CACHE_PATHS; do
            if hash="$(git rev-parse "HEAD:${path}" 2>/dev/null)"; then
              parts+=(--part "path:${path}=${hash}")
            else
              # A named path that does not exist is an ingredient we cannot
              # resolve, so it goes in as empty rather than being dropped: two
              # materially different trees must not hash the same.
              parts+=(--part "path:${path}=")
            fi
          done

          # The reference side.
          #
          # With a reference cache, the references this run will read ARE that
          # branch's contents, so its head commit identifies them exactly — and
          # costs no Figma call, which is the whole point of the split (#289).
          # Without one, fall back to asking Figma for each file's `version`:
          # one request per file to answer "can any reference have moved?", and
          # a token that cannot answer it means no skip.
          if [ -n "${REFERENCE_CACHE_BRANCH:-}" ]; then
            head="$(git ls-remote "$repo" "refs/heads/${REFERENCE_CACHE_BRANCH}" | cut -f1)"
            parts+=(--part "reference-cache=${head}")
            if [ -z "$head" ]; then
              echo "::warning title=No reference cache::'${REFERENCE_CACHE_BRANCH}' does not exist yet. Run the import workflow, or every figma reference will be reported as a cache miss."
            fi
          elif [ -n "${FIGMA_TOKEN:-}" ] && [ -f design-map.json ]; then
            for key in $(jq -r '[.components[].ref | select(startswith("figma:")) | split(":")[1] | split("/")[0]] | unique[]' design-map.json); do
              version="$(curl -sS -H "X-Figma-Token: ${FIGMA_TOKEN}" \
                "https://api.figma.com/v1/files/${key}?depth=1" | jq -r '.version // ""')"
              parts+=(--part "figma:${key}=${version}")
            done
          fi
          if [ -f design-map.json ]; then
            parts+=(--part "design-map=$(sha256sum design-map.json | cut -d' ' -f1)")
          else
            parts+=(--part "design-map=")
          fi
          [ -f .design-parity.json ] && parts+=(--part "policy=$(sha256sum .design-parity.json | cut -d' ' -f1)")

          # The tool and its surroundings. `runner` is a coarse proxy for image
          # drift: it names the label, not the image, so `force-refresh` on a
          # schedule remains the real defence.
          #
          # The tool goes in as the code it resolves to, not as the label it was
          # asked for. Both spellings of that label float: `ref: main` names the
          # same thing however far `main` has moved, and `version: latest` — the
          # default — names the same thing across every release. Keyed by label,
          # a genuinely new tool reads as an unchanged ingredient and the run
          # re-applies the old verdict (#380). The ref is already checked out at
          # .design-parity-src by the step above, so its sha is free; a version
          # costs one registry lookup, and a pinned `0.1.57` resolves to itself,
          # so what the lookup really buys is the floating aliases.
          if [ -n "${DP_REF:-}" ]; then
            tool="$(git -C "${GITHUB_WORKSPACE}/.design-parity-src" rev-parse HEAD)"
          else
            tool="$(npm view "design-parity@${DP_VERSION}" version --json 2>/dev/null \
              | jq -r 'if type == "array" then last elif type == "string" then . else empty end' || true)"
            # A registry that will not answer must not collapse every version to
            # the same empty part. Fall back to the literal: exact for a pinned
            # version, and no worse than before for an alias.
            if [ -z "$tool" ]; then
              tool="$DP_VERSION"
              echo "::warning title=Unresolved tool version::Could not resolve 'design-parity@${DP_VERSION}' to a published version, so the cache key names the alias instead. A new release may not invalidate it."
            fi
          fi
          parts+=(--part "tool=${tool}")
          parts+=(--part "renderer=${{ inputs.compose-preview-version }}")
          parts+=(--part "runner=${{ inputs.runs-on }}")
          parts+=(--part "module=${{ inputs.module }}")
          parts+=(--part "shards=${{ inputs.shards }}")
          parts+=(--part "map-command=${{ inputs.design-map-command }}")

          if [ -n "${DP_REF:-}" ]; then
            dp=(node "${GITHUB_WORKSPACE}/.design-parity-src/packages/cli/bin/design-parity.mjs")
          else
            dp=(npx -y "design-parity@${DP_VERSION}")
          fi
          prev=()
          if [ "${{ steps.previous.outputs.found }}" = "true" ]; then prev=(--previous previous); fi
          force=()
          if [ "${FORCE}" = "true" ]; then force=(--force); fi

          "${dp[@]}" cache "${parts[@]}" "${prev[@]}" "${force[@]}" | tee decision.txt
          cat decision.txt >> "$GITHUB_OUTPUT"
          reason="$(grep '^reason=' decision.txt | cut -d= -f2-)"
          if grep -q '^skip=true' decision.txt; then
            echo "::notice::Skipping the parity run — ${reason}. The published board already describes this commit."
          else
            echo "::notice::Running — ${reason}."
          fi

  plan:
    name: Plan ${{ inputs.shards }} shard(s)
    needs: [cache]
    if: ${{ !cancelled() && inputs.shards > 1 && needs.cache.outputs.skip != 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build the shard matrix
        id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          echo "matrix=[$(seq -s, 1 "$SHARDS")]" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # Skipped for a ref: the gate exists to catch a published version too old
      # to reassemble shards, and a ref IS the code under test.
      - name: Check the CLI can merge shard runs
        if: ${{ inputs.design-parity-ref == '' }}
        env:
          DP_VERSION: ${{ inputs.design-parity-version }}
        run: |
          set -euo pipefail
          # `merge` with no args prints usage and exits 2; an older CLI falls
          # through to `run`, whose usage names `--components` instead.
          usage="$(npx -y "design-parity@${DP_VERSION}" merge 2>&1 || true)"
          if printf '%s' "$usage" | grep -q 'design-parity merge'; then
            echo "✓ design-parity@${DP_VERSION} supports 'merge'."
            exit 0
          fi
          echo "::error title=CLI too old for shards::design-parity@${DP_VERSION} has no 'merge' subcommand, which a sharded run needs to reassemble the shards. Raise design-parity-version, or set shards: 1."
          exit 1

  # ── Shard: render + compare one slice ───────────────────────────────────────
  # Render and comparison live in ONE job rather than two fan-outs joined by an
  # artifact: the bundle a shard renders is consumed only by that shard's own
  # comparison, so shipping it between jobs would mean uploading and downloading
  # hundreds of MB to hand a job data it already had. It also keeps the invariant
  # local — one job, one `--shard` value, both steps reading it.
  shard:
    name: Parity ${{ inputs.shards > 1 && format('shard {0}/{1}', matrix.shard, inputs.shards) || '(single job)' }}
    needs: [plan, cache]
    # A skipped `plan` is the single-shard path, not a failure. A `cache` that
    # decided to skip is not either — the verdict is re-applied by `publish`.
    if: ${{ !cancelled() && needs.plan.result != 'failure' && needs.plan.result != 'cancelled' && needs.cache.outputs.skip != 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      # A dead shard takes the run with it: the merge needs every slice, so
      # letting the siblings burn another 20 minutes to produce an unpublishable
      # half-run helps nobody.
      fail-fast: true
      matrix:
        # The `|| '[1]'` is inert insurance: with `shards` at its default `plan`
        # is skipped and its output is empty, and `strategy` is expanded early
        # enough that a bare `fromJSON('')` can fail the workflow rather than
        # produce the single-shard case.
        shard: ${{ fromJSON(needs.plan.outputs.matrix || '[1]') }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # Every shard pays the Gradle configure + compile in full — it is the
      # `fixed` term that does NOT divide — so the cache is what keeps that term
      # at ~4 min instead of ~10. Read-only by default: N shards racing to write
      # one cache entry gains nothing, and a run triggered from a fork must not
      # write it at all.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ inputs.gradle-cache-read-only }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # Build the CLI under test. Workspace resolution is the point: running
      # `packages/cli/bin/design-parity.mjs` from a checkout binds
      # `@design-parity/*` to the sibling workspaces rather than to whatever npm
      # would fetch, so a change in an adapter is actually the code that runs.
      - name: Check out design-parity@${{ inputs.design-parity-ref }}
        if: ${{ inputs.design-parity-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: ${{ inputs.design-parity-ref }}
          path: .design-parity-src

      - name: Build design-parity from source
        if: ${{ inputs.design-parity-ref != '' }}
        working-directory: .design-parity-src
        run: |
          set -euo pipefail
          npm ci --silent
          npm run build --silent
          node packages/cli/bin/design-parity.mjs merge >/dev/null 2>&1 || true
          echo "::notice::Running design-parity from ${{ inputs.design-parity-ref }} rather than the published CLI."

      - name: Install compose-preview CLI
        uses: yschimke/compose-ai-tools/.github/actions/install@main
        with:
          version: ${{ inputs.compose-preview-version }}
          catalog-key: ${{ inputs.catalog-key }}
          github-token: ${{ github.token }}

      # Read through env, never interpolated into the script body: an input
      # spliced into `run:` is the classic template-injection shape, and a
      # reusable workflow's inputs come from whatever repo calls it.
      - name: Regenerate the design map
        if: ${{ inputs.design-map-command != '' }}
        env:
          DESIGN_MAP_COMMAND: ${{ inputs.design-map-command }}
        run: bash -eo pipefail -c "$DESIGN_MAP_COMMAND"

      # What this job renders, and what the whole run compares.
      #
      # Note the asymmetry, which is load-bearing: the RENDER is given this
      # shard's slice, but the comparison is given the FULL component list and
      # partitions it itself from `--shard i/N`. Handing `run --shard` a
      # pre-sliced list would make it partition the slice again and compare a
      # fraction of a fraction. One partition, derived twice from the same
      # implementation — never sliced twice.
      - name: Plan this shard
        id: slice
        env:
          DP_VERSION: ${{ inputs.design-parity-version }}
          SHARD: ${{ inputs.shards > 1 && matrix.shard || 1 }}
          SHARDS: ${{ inputs.shards }}
          COMPONENTS: ${{ inputs.components }}
          MODULE: ${{ inputs.module }}
          PREVIEW_MANIFEST: ${{ inputs.preview-manifest }}
        run: |
          set -euo pipefail
          scope=()
          if [ -n "$COMPONENTS" ]; then scope=(--components "$COMPONENTS"); fi
          dp() { npx -y "design-parity@${DP_VERSION}" shard --repo . "${scope[@]}" "$@"; }
          # `--shard 1/1` is the identity partition: every component, in the one
          # canonical order. This is the exhaustive list — nothing hand-scoped.
          dp --shard 1/1 > all-components.txt
          dp --shard "${SHARD}/${SHARDS}" > slice-components.txt
          dp --shard "${SHARD}/${SHARDS}" --field previewId > slice-previews.txt

          # The complement is what this shard must NOT render, and it is only as
          # complete as the set it is taken against. Against the design map it
          # names the previews the OTHER SHARDS own and nothing else — so a
          # module holding unmapped previews (a catalog: m3-catalog draws 1,095,
          # maps 77) would have every shard render all 1,018 unmapped ones and
          # divide nothing. `--preview-universe` is what makes it the module's
          # full preview set instead.
          manifest="$PREVIEW_MANIFEST"
          if [ -z "$manifest" ]; then
            # `:a:b` ⇒ `a/b/build/compose-previews/previews.json`
            path="${MODULE#:}"
            manifest="${path//://}/build/compose-previews/previews.json"
          fi
          # Does this CLI know the flag? Its usage line lists it; a CLI predating
          # it does not. Worth checking rather than just passing it: an older
          # `shard` rejects unknown options, and one older still would swallow
          # the PATH as a component handle and scope the render off nonsense.
          #
          # Capture first, THEN grep. `shard` with no selector prints usage and
          # exits 2, and under `set -o pipefail` that exit code propagates out of
          # `npx … | grep -q` no matter what grep found — so the piped form
          # reported "too old" against every version, including ones carrying the
          # flag. Same shape as the `merge` probe in the plan job, for the same
          # reason.
          usage="$(npx -y "design-parity@${DP_VERSION}" shard 2>&1 || true)"
          if printf '%s' "$usage" | grep -q -- '--preview-universe'; then
            universe=true
          else
            universe=false
            echo "::warning title=CLI too old to scope the render::design-parity@${DP_VERSION} has no '--preview-universe', so the render cannot be limited to this shard's slice — every shard will draw the whole module. Raise design-parity-version."
          fi

          if [ "$universe" = true ] && [ -f "$manifest" ]; then
            dp --shard "${SHARD}/${SHARDS}" --field previewId --complement \
              --preview-universe "$manifest" > slice-excluded.txt
          else
            if [ "$universe" = true ]; then
              echo "::warning title=Render not scoped::No preview manifest at '${manifest}' — every shard will render the whole module. Set preview-manifest, or have design-map-command write the discovery manifest there."
            fi
            dp --shard "${SHARD}/${SHARDS}" --field previewId --complement \
              > slice-excluded.txt
          fi
          {
            echo "components<<EOF"
            paste -sd, - < all-components.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < slice-components.txt)" >> "$GITHUB_OUTPUT"
          echo "Shard ${SHARD}/${SHARDS}: $(wc -l < slice-components.txt) of" \
            "$(wc -l < all-components.txt) component(s);" \
            "$(wc -l < slice-previews.txt) preview(s) to render," \
            "$(wc -l < slice-excluded.txt) excluded."

      # The desktop (Skiko/CPU) render daemon links libGL; install Mesa's
      # software GL and a font stack.
      - name: Install desktop (Skiko) render deps
        if: ${{ inputs.desktop-render && steps.slice.outputs.count != '0' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libfreetype6 libfontconfig1 fontconfig

      - name: Render this shard's candidates
        if: ${{ steps.slice.outputs.count != '0' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MODULE: ${{ inputs.module }}
          RENDER_TIMEOUT: ${{ inputs.render-timeout }}
        run: |
          set -euo pipefail
          mkdir -p build/design-parity
          args=()
          while IFS= read -r id; do args+=(--id "$id"); done < slice-previews.txt
          # An empty exclusion list means this shard owns everything — passing
          # `--exclude-preview-id ""` would be read as excluding nothing named,
          # so skip the flag rather than pass an empty value.
          if [ -s slice-excluded.txt ]; then
            args+=(--exclude-preview-id "$(paste -sd, - < slice-excluded.txt)")
          fi
          run() {
            if [ "${{ inputs.desktop-render }}" = "true" ]; then
              xvfb-run -a -s "-screen 0 2000x1400x24" "$@"
            else
              "$@"
            fi
          }
          # --with-semantics injects each preview's a11y tree, resolved
          # foreground/background colours and per-node design tokens, so the
          # token / contrast / a11y checks can evaluate instead of reporting them
          # as missing from the candidate.
          run compose-preview bundle pack --module "$MODULE" "${args[@]}" \
            --with-semantics -o build/design-parity/candidates.bundle.png \
            --timeout "$RENDER_TIMEOUT"
          # Assert the artifact rather than trusting the exit status: a failed
          # Gradle model query has been observed printing an error and still
          # exiting 0, which would sail past `set -e` and leave the parity run
          # reporting "no candidate render available" on a green job.
          test -s build/design-parity/candidates.bundle.png

      # The reference side, imported on its own schedule rather than re-fetched
      # here. Every shard reads the same commit of the same branch, so N shards
      # multiply the reference cost by nothing at all — where N live fan-outs
      # multiplied it by N against a single per-token rate limiter (#289).
      - name: Fetch the reference cache
        id: refcache
        if: ${{ inputs.reference-cache-branch != '' && steps.slice.outputs.count != '0' }}
        env:
          BRANCH: ${{ inputs.reference-cache-branch }}
          CACHE_DIR: ${{ runner.temp }}/reference-cache
        run: |
          set -euo pipefail
          repo="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch "$BRANCH" "$repo" "$CACHE_DIR" 2>/dev/null; then
            rm -rf "$CACHE_DIR/.git"
            echo "dir=${CACHE_DIR}" >> "$GITHUB_OUTPUT"
            echo "Reference cache from ${BRANCH}: $(du -sh "$CACHE_DIR" | cut -f1)."
          else
            # Not fatal: the run proceeds and reports the references it cannot
            # find, which is a visible gap rather than a silent one.
            echo "::warning title=No reference cache::Could not read '${BRANCH}'. Run the import workflow (design-parity-import-reusable.yml) to build it."
          fi

      - name: Run design-parity
        id: parity
        if: ${{ steps.slice.outputs.count != '0' }}
        env:
          FIGMA_TOKEN: ${{ secrets.figma-token }}
          DP_VERSION: ${{ inputs.design-parity-version }}
          DP_REF: ${{ inputs.design-parity-ref }}
          COMPONENTS: ${{ steps.slice.outputs.components }}
          SHARD: ${{ inputs.shards > 1 && matrix.shard || 1 }}
          SHARDS: ${{ inputs.shards }}
          BRANCH: ${{ inputs.artifact-branch }}
          REFERENCE_CACHE_BRANCH: ${{ inputs.reference-cache-branch }}
          REFERENCE_CACHE: ${{ steps.refcache.outputs.dir }}
        run: |
          set -euo pipefail
          # A token is only required when the run has to fetch references. With
          # a cache branch configured it reads them off disk, so a repo running
          # this way needs no Figma credential in its parity workflow at all.
          if [ -z "${FIGMA_TOKEN:-}" ] && [ -z "${REFERENCE_CACHE_BRANCH:-}" ]; then
            echo "::warning::FIGMA_TOKEN is not set and no reference-cache-branch is configured — skipping the parity run."
            exit 0
          fi
          # `--shard` makes the run write the `shard.json` the merge reads, and
          # makes a blocking verdict exit 0 here: the verdict belongs to the RUN
          # and is applied once, by the merge, after the artifacts are published.
          # Exiting non-zero per shard would take the fan-out down (fail-fast)
          # and strand the very reports that diagnose the failure.
          if [ -n "${DP_REF:-}" ]; then
            dp=(node "${GITHUB_WORKSPACE}/.design-parity-src/packages/cli/bin/design-parity.mjs")
          else
            dp=(npx -y "design-parity@${DP_VERSION}")
          fi

          # Does this CLI know the flag? Worth asking rather than just passing
          # it: `run` ignores an unrecognised `--option` but treats the VALUE
          # after it as a component handle, so an older CLI would compare a
          # component named `/tmp/reference-cache` and report it unresolved.
          #
          # Capture first, THEN grep — the usage path exits 2, and under
          # pipefail that status wins over grep's no matter what it matched.
          refcache=()
          if [ -n "${REFERENCE_CACHE:-}" ]; then
            usage="$("${dp[@]}" run 2>&1 || true)"
            if printf '%s' "$usage" | grep -q -- '--reference-cache'; then
              # `--reference-cache-only` is the point, not a hardening extra:
              # without it a cache miss falls back to the API and the run is
              # back to being rate-limitable, just less often.
              refcache=(--reference-cache "$REFERENCE_CACHE" --reference-cache-only)
            else
              echo "::warning title=CLI too old to read the reference cache::design-parity@${DP_VERSION} has no '--reference-cache', so this run will fetch every reference live. Raise design-parity-version."
            fi
          fi

          "${dp[@]}" run \
            --repo . \
            --components "$COMPONENTS" \
            "${refcache[@]}" \
            --shard "${SHARD}/${SHARDS}" \
            --candidate-bundles build/design-parity/candidates.bundle.png \
            --out build/design-parity/out \
            --repo-slug "${GITHUB_REPOSITORY}" \
            --branch "${BRANCH}" \
            --source-commit "${GITHUB_SHA}"
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # Even an empty slice uploads: the merge treats a shard that never reported
      # as a hard error rather than an absence, which is what catches a lost
      # upload instead of publishing a quietly incomplete index.
      - name: Upload shard ${{ matrix.shard }}
        if: ${{ inputs.shards > 1 && steps.parity.outputs.ran == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-parity-shard-${{ matrix.shard }}
          path: build/design-parity/out
          if-no-files-found: error
          retention-days: 1

      # Single-shard runs skip the merge entirely, so they publish from here —
      # the same artifact set, assembled by the run itself.
      - name: Upload the run
        if: ${{ inputs.shards < 2 && steps.parity.outputs.ran == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-parity-run
          path: build/design-parity/out
          if-no-files-found: error
          retention-days: 1

  # ── Merge + publish ─────────────────────────────────────────────────────────
  publish:
    name: Merge and publish
    needs: [shard, cache]
    if: ${{ !cancelled() && (needs.shard.result == 'success' || needs.cache.outputs.skip == 'true') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # Build the CLI under test. Workspace resolution is the point: running
      # `packages/cli/bin/design-parity.mjs` from a checkout binds
      # `@design-parity/*` to the sibling workspaces rather than to whatever npm
      # would fetch, so a change in an adapter is actually the code that runs.
      - name: Check out design-parity@${{ inputs.design-parity-ref }}
        if: ${{ inputs.design-parity-ref != '' && needs.cache.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: ${{ inputs.design-parity-ref }}
          path: .design-parity-src

      - name: Build design-parity from source
        if: ${{ inputs.design-parity-ref != '' && needs.cache.outputs.skip != 'true' }}
        working-directory: .design-parity-src
        run: |
          set -euo pipefail
          npm ci --silent
          npm run build --silent
          node packages/cli/bin/design-parity.mjs merge >/dev/null 2>&1 || true
          echo "::notice::Running design-parity from ${{ inputs.design-parity-ref }} rather than the published CLI."

      # Nothing was rendered and nothing compared, so there is nothing to
      # publish: the branch already holds the board this commit would produce.
      # The verdict still applies — a blocking finding does not lapse because
      # the inputs held still.
      - name: Re-apply the cached verdict
        if: ${{ needs.cache.outputs.skip == 'true' }}
        env:
          BRANCH: ${{ inputs.artifact-branch }}
        run: |
          set -euo pipefail
          if [ "${{ needs.cache.outputs.blocked }}" = "true" ]; then
            echo "::error title=Design parity blocked::Inputs unchanged since the last run, which was blocking. See the published report on ${BRANCH}."
            exit 1
          fi
          echo "::notice::Inputs unchanged since the last run, which passed. Nothing to re-render."

      - name: Download the shard runs
        if: ${{ needs.cache.outputs.skip != 'true' }}
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: design-parity-*
          path: shards

      # The board this run builds on. Publishing REPLACES the branch, so without
      # this a component the run could not refresh — rate limited, a source
      # briefly unreachable — loses not just its verdict but its last good
      # report. `merge --previous` rolls those rows forward and dates them, so a
      # partial refresh converges instead of thrashing (#289).
      - name: Fetch the previous board
        id: previous
        if: ${{ inputs.artifact-branch != '' && needs.cache.outputs.skip != 'true' }}
        env:
          BRANCH: ${{ inputs.artifact-branch }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch "$BRANCH" "$repo" previous 2>/dev/null; then
            rm -rf previous/.git
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Carrying forward from $(ls previous | wc -l) published path(s)."
          else
            # First run on a repo, or the branch was pruned. Not an error: there
            # is simply nothing to carry, and the merge writes the first board.
            echo "::notice::No existing ${BRANCH} to carry forward from."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Nothing to do when every shard skipped (no FIGMA_TOKEN, or an empty
      # design map). A skip is not a failure, and publishing an empty branch over
      # a good one would be worse than doing nothing.
      - name: Anything to publish?
        id: check
        if: ${{ needs.cache.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          if [ -z "$(find shards -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null)" ]; then
            echo "::notice::No shard produced artifacts — nothing to merge or publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # The verdict is applied AFTER publishing, so a blocking run still ships
      # the reports that explain it. `merge` writes its artifacts before it
      # fails, which is what makes `continue-on-error` here safe rather than a
      # swallowed failure — the exit code is re-applied at the end of the job.
      - name: Merge the shards
        id: merge
        if: ${{ steps.check.outputs.found == 'true' }}
        continue-on-error: true
        env:
          DP_VERSION: ${{ inputs.design-parity-version }}
          DP_REF: ${{ inputs.design-parity-ref }}
          BRANCH: ${{ inputs.artifact-branch }}
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
          CACHE_KEY: ${{ needs.cache.outputs.key }}
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find shards -name shard.json | sort -V)
          if [ "${#dirs[@]}" -eq 0 ]; then
            # A run old enough not to write shard.json. Publish what it made,
            # but do NOT fold the previous board in here: without `merge` there
            # is nothing to regenerate index.html, README.md and run.json from,
            # so carried reports would sit on the branch unlisted — a board that
            # silently under-reports what it holds is worse than one that is
            # honestly only this run.
            cp -a "$(find shards -mindepth 1 -maxdepth 1 -type d | head -1)" out
            if [ "${PREVIOUS_FOUND}" = "true" ]; then
              echo "::warning::This run did not write shard.json, so the previous board could not be carried forward. Upgrade design-parity-version to get partial refresh."
            fi
            echo "blocked=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=()
          if [ "${PREVIOUS_FOUND}" = "true" ]; then prev=(--previous previous); fi
          if [ -n "${DP_REF:-}" ]; then
            dp=(node "${GITHUB_WORKSPACE}/.design-parity-src/packages/cli/bin/design-parity.mjs")
          else
            dp=(npx -y "design-parity@${DP_VERSION}")
          fi
          if "${dp[@]}" merge "${dirs[@]}" \
            --out out \
            "${prev[@]}" \
            --repo-slug "${GITHUB_REPOSITORY}" \
            --branch "${BRANCH}" \
            --source-commit "${GITHUB_SHA}" \
            ${CACHE_KEY:+--cache-key "$CACHE_KEY"}; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to ${{ inputs.artifact-branch }}
        if: ${{ steps.check.outputs.found == 'true' && inputs.artifact-branch != '' && hashFiles('out/**') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.artifact-branch }}
          DP_VERSION: ${{ inputs.design-parity-version }}
          DP_REF: ${{ inputs.design-parity-ref }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE_COMMIT
          if [ -n "${DP_REF:-}" ]; then
            dp=(node "${GITHUB_WORKSPACE}/.design-parity-src/packages/cli/bin/design-parity.mjs")
          else
            dp=(npx -y "design-parity@${DP_VERSION}")
          fi
          # `publish` re-parents the staged tree on the branch tip and retries a
          # push another run won. This step used to inline `git init` + `push
          # -f`, which replaced the branch with a fresh single-commit orphan
          # every time — while the board's own README links a per-component
          # History (`commits/<branch>/<component>/report.html`), so it
          # advertised a trend it destroyed on each run. Baseline mode already
          # published the right way; this is the sharded path joining it, so
          # there is one publisher rather than two that disagree.
          #
          # But this workflow is versioned by its `uses:` ref while the CLI is
          # versioned by `design-parity-version` — they move independently, and
          # that input is pinnable, so "the CLI predates `publish`" is not just
          # the window before the next release: a consumer can sit there
          # indefinitely. A launcher predating `publish` does NOT reject the
          # unknown subcommand; it runs a parity comparison and exits **0**
          # (verified against 0.1.54), which would leave the board silently
          # stale behind a green step. So probe, and fall back rather than
          # assume. Same shape as the `merge` step's shard.json degradation.
          #
          # The probe is a deliberately incomplete invocation: side-effect free,
          # and only a CLI carrying `publish` names the missing flags. Captured
          # rather than piped because the new CLI exits 2 here and `pipefail`
          # would read that as "no publish".
          probe="$("${dp[@]}" publish 2>&1 || true)"
          case "$probe" in
            *"--dir and --branch are required"*) has_publish=true ;;
            *) has_publish=false ;;
          esac

          if [ "$has_publish" = true ]; then
            "${dp[@]}" publish --dir out --branch "$BRANCH"
            exit 0
          fi

          echo "::warning::design-parity@${DP_VERSION} has no 'publish' subcommand; appending in-workflow instead. Upgrade design-parity-version to move onto the shared publisher (it retries a push race up to five times; this fallback retries once)."

          # Fallback for a pinned-older CLI. Delete it once the supported floor
          # carries `publish`. Deliberately the same *shape* as `publishBaseline`
          # — append on the tip, never force — so a consumer on either path gets
          # a branch that is a history rather than a snapshot.
          repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish_append() {
            art="$1"
            if git clone -q --depth 1 --branch "$BRANCH" "$repo" "$art" 2>/dev/null; then
              # Replace the tree wholesale, keeping `.git`: a component dropped
              # from the board must disappear, not linger from the last run.
              find "$art" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            else
              # First run on a repo, or the branch was pruned. Not an error:
              # there is nothing to append to, so start the history.
              mkdir -p "$art"
              git -C "$art" init -q
              git -C "$art" checkout -q -b "$BRANCH"
            fi
            cp -a out/. "$art/"
            git -C "$art" add -A
            git -C "$art" \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "design-parity artifacts for ${GITHUB_SHA}"
            git -C "$art" push "$repo" "$BRANCH"
          }

          # A plain push is what keeps the history: it is *rejected* rather than
          # discarding a board another run published while this one rendered.
          # Replay once onto the new tip — the work is already in `out/`, so the
          # retry re-commits, it does not re-render.
          if ! publish_append "$(mktemp -d)/board"; then
            echo "::notice::Push rejected — ${BRANCH} moved while this run was in flight. Replaying onto the new tip."
            publish_append "$(mktemp -d)/board"
          fi

      # The run's verdict, applied last — after the reports that explain it are
      # on the branch. This is the step that fails a blocking run.
      - name: Apply the parity verdict
        if: ${{ steps.merge.outputs.blocked == 'true' }}
        env:
          BRANCH: ${{ inputs.artifact-branch }}
        run: |
          echo "::error title=Design parity blocked::The parity direction blocks on a failing verdict. See the published report on ${BRANCH}."
          exit 1
