name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck & build
        run: npm run build
      - name: Validate design-map fixtures against schema
        run: |
          node packages/core/dist/cli/validate-design-map.js \
            fixtures/design-map.json examples/design-map.json
      - name: Validate DTCG token fixture against schema
        run: |
          node packages/core/dist/cli/validate-dtcg.js \
            fixtures/tokens.tokens.json
      - name: Validate parity-config example against schema
        run: |
          node packages/policy/dist/cli/validate-config.js \
            examples/design-parity.json
      - name: Validate checks-config example against schema
        run: |
          node packages/checks/dist/cli/validate-checks.js \
            examples/design-parity.checks.json
      # The kit index is generated rather than authored, so there is no example
      # to validate — but the shipped `validate` bin is the thing a consumer
      # runs against their own generated index, and nothing else exercises it.
      - name: Validate kit-index fixture through the CLI
        run: |
          node packages/kit-index/dist/cli/kit-index.js validate \
            --index packages/kit-index/test/fixtures/m3-kit-index.json
      - name: Test
        run: npm test
      # Shell, not TypeScript: the reusable workflow's capability probes and its
      # run-cache key live in `run:` blocks that `npm test` cannot reach. Both
      # fail silently — a probe that fails open disables the feature it gates,
      # and a cache key that fails open skips a run that should have happened.
      - name: Test reusable-workflow shell
        run: scripts/test-workflow-probes.sh
      # Also out of `npm test`'s reach, and invisible until it reaches npm: the
      # release job runs `set-version` in its own tree and publishes the result,
      # so this script decides what every consumer's install resolves to.
      - name: Test the published dependency ranges
        run: scripts/test-set-version.sh
