name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck & build
        run: npm run build
      - name: Validate design-map fixtures against schema
        run: |
          node packages/core/dist/cli/validate-design-map.js \
            fixtures/design-map.json examples/design-map.json
      - name: Validate DTCG token fixture against schema
        run: |
          node packages/core/dist/cli/validate-dtcg.js \
            fixtures/tokens.tokens.json
      - name: Validate parity-config example against schema
        run: |
          node packages/policy/dist/cli/validate-config.js \
            examples/design-parity.json
      - name: Validate checks-config example against schema
        run: |
          node packages/checks/dist/cli/validate-checks.js \
            examples/design-parity.checks.json
      - name: Test
        run: npm test
      # Shell, not TypeScript: the reusable workflow's capability probes live in
      # `run:` blocks that `npm test` cannot reach, and a probe that fails open
      # silently disables the feature it gates.
      - name: Test reusable-workflow capability probes
        run: scripts/test-workflow-probes.sh
