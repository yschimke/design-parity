name: UID workflow tests

on:
  pull_request:
    paths:
      - '.github/workflows/uid-parity-reusable.yml'
      - '.github/workflows/uid-parity-comment-reusable.yml'
      - '.github/workflows/uid-workflow-tests.yml'
      - 'scripts/test_uid_workflow.py'
      - 'scripts/test_uid_comment_workflow.py'
      - 'scripts/uid/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/uid-parity-reusable.yml'
      - '.github/workflows/uid-parity-comment-reusable.yml'
      - '.github/workflows/uid-workflow-tests.yml'
      - 'scripts/test_uid_workflow.py'
      - 'scripts/test_uid_comment_workflow.py'
      - 'scripts/uid/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - run: python -m pip install PyYAML==6.0.3 Pillow==12.3.0
      - run: python scripts/test_uid_workflow.py -v
      - run: python scripts/test_uid_comment_workflow.py -v
      - run: python -m unittest discover -s scripts/uid -p 'test_*.py' -v
