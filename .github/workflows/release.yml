name: release

# release-please drives releases. On every push to main it maintains a single
# "release PR" (one shared version + one CHANGELOG for the whole repo). Merging
# that PR makes release-please tag `vX.Y.Z`, cut the GitHub release, and — in the
# same run — publish all 15 packages to npm.
#
# IMPORTANT: this file is `release.yml` because the npm Trusted Publisher (OIDC)
# for each package is bound to this exact workflow filename. Don't rename it, or
# OIDC publishing breaks until every package's trusted publisher is reconfigured.
on:
  push:
    branches: [main]
  # Lets scheduled-merge.yml re-trigger release-please after bot merges
  # (GITHUB_TOKEN merges don't fire push workflows). Left blank, `tag` keeps
  # that dispatch to its original job: refresh the release PR, publish nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to (re)publish, e.g. v0.1.43 — recovery only, for a
          release that was cut but never reached npm. Leave blank to just
          refresh the release-please PR.
        required: false
        type: string

permissions:
  contents: write # release-please commits/tags the release
  pull-requests: write # release-please maintains the release PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release-please:
    # Never on a recovery dispatch. If a release PR had just been merged, this job could CREATE
    # that release while `publish` below checks out the older `inputs.tag` — the new version would
    # end up tagged with no run left that would ever publish it, which is precisely the stranding
    # the tag input exists to undo. Recovery and releasing are separate errands; a run does one.
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Pinned to the same v5.0.0 commit the sibling repos (compose-ai-tools,
      # meshcore-mobile) run. config-file/manifest-file are passed explicitly
      # (matching the siblings) rather than relying on default resolution.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `release_created` is only true on the single run that cuts the release.
    # When runners are backed up, a later push can execute first and create the
    # release itself; by the time the release commit's own run gets a runner,
    # release-please reports "Found release for path ., vX.Y.Z" and sets no
    # output — so publish is gated off on *every* run and the version is
    # stranded on the tag, never reaching npm. That happened to v0.1.43.
    #
    # Dispatching with a `tag` is the escape hatch (matching the sibling repo
    # compose-ai-tools, whose release.yml takes a tag input for the same
    # reason). It must be an explicit input rather than just the event name:
    # scheduled-merge.yml dispatches this workflow after every bot merge purely
    # to refresh the release PR, and those runs must not build or publish.
    #
    # The publish loop below already skips packages whose version is on npm, so
    # re-publishing an in-sync release is a no-op.
    #
    # `!cancelled()` is what lets this run at all on the recovery path: release-please is skipped
    # there, and a job whose `needs` was skipped is skipped too unless the condition says
    # otherwise. The `result != 'failure'` guard keeps that from also swallowing a release-please
    # that genuinely broke on the push path.
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    steps:
      # `ref` below takes a branch name or a bare SHA as readily as a tag, and this job runs with
      # `id-token: write`. Dispatching `main` by mistake would build the branch and publish it
      # under whatever version the tree happens to carry. Require a real release tag first.
      - name: Verify the input names an existing release tag
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a vX.Y.Z release tag."; exit 1 ;;
          esac
          # Resolving through git/ref/tags is the check that matters — a branch or SHA of the same
          # spelling does not answer here. Compare the returned ref rather than trusting the exit
          # status: the singular git/ref/ endpoint 404s on a partial match today, but its plural
          # sibling answers those with an ARRAY of near-misses, and a guard one character away
          # from that behaviour should not depend on which one it is talking to. Anything that is
          # not exactly this tag — an array, a null, a near-miss — fails closed.
          resolved=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.ref' 2>/dev/null || true)
          if [ "${resolved}" != "refs/tags/${TAG}" ]; then
            echo "::error::'$TAG' does not resolve to exactly refs/tags/${TAG} (got: '${resolved:-nothing}')."
            exit 1
          fi
      # Recovery dispatches build the TAG, never the branch. `main` has moved on
      # since the stranded release was cut, while the root version still reads
      # the last released one — checking out the branch would publish newer
      # source under the older version. The manifest + tag are the source of
      # truth (AGENTS.md), so the tag is what gets built. On the push path this
      # is github.sha, i.e. the release commit, exactly as before.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.sha }}
      # The tag and the version it publishes under have to be the same release. `set-version`
      # below derives the version from this tree's root package.json, so a tag whose tree says
      # something else would publish under a version nobody tagged.
      - name: Verify the tag carries the version it names
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::${TAG} checks out a tree whose root version is ${version}."
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      # release-please bumps the root version; fan it out to every workspace
      # package + internal dependency range before publishing. This runs in the
      # runner's working tree only and is not committed back (see the note after
      # the publish step).
      - name: Sync workspace versions to the release
        run: npm run set-version "$(node -p "require('./package.json').version")"
      - run: npm run build
      - run: npm test
      # Trusted publishing: OIDC supplies the credential (no NODE_AUTH_TOKEN),
      # provenance is automatic (no --provenance flag) — except on the recovery path, see below.
      #
      # Publish per-workspace so one failure (e.g. a brand-new package without
      # OIDC trusted-publisher yet) does not abort the rest. Treat
      # already-published versions as success so partial-publish reruns finish
      # the job. Any other publish error still fails the workflow.
      - name: Publish workspaces
        env:
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          set -u
          # A recovery publish carries NO provenance. npm's provenance generator reads GITHUB_SHA
          # and GITHUB_REF, which still point at the dispatch commit on main even though the
          # tarball was built from the tag — so the attestation it would emit names a commit that
          # never produced the artifact. A package with no attestation is a gap; one with a false
          # attestation is a lie, and the lie is worse. The push path is unaffected: there the ref
          # and the tree are the same commit, so provenance stays on and stays true.
          publish_flags=()
          if [ -n "${RECOVERY_TAG}" ]; then
            publish_flags+=(--provenance=false)
            echo "recovery publish of ${RECOVERY_TAG}: provenance disabled (ref != built tree)"
          fi
          fail=0
          for ws in $(node -p "
            const {globSync, existsSync} = require('node:fs');
            const root = require('./package.json');
            (root.workspaces ?? [])
              .flatMap(p => globSync(p))
              .filter(d => existsSync(d + '/package.json'))
              .filter(d => !(require('./' + d + '/package.json').private))
              .join('\n')
          "); do
            name=$(node -p "require('./${ws}/package.json').name")
            version=$(node -p "require('./${ws}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already published)"
              continue
            fi
            # `npm publish` repoints `latest` at whatever it publishes unless --tag says
            # otherwise. Backfilling a package that is missing an OLD version, after a newer one
            # already shipped, would therefore drag `latest` backwards and make a bare
            # `npm i ${name}` resolve to the older release. Publish those under `backfill` and
            # leave `latest` where it is. Versions here are plain X.Y.Z (release-please's default),
            # which is all the comparison below assumes.
            tag_flags=()
            latest=$(npm view "${name}" version 2>/dev/null || true)
            if [ -n "${latest}" ] && node -e '
              const part = (s) => s.split(".").map(Number);
              const [a, b] = [part(process.argv[1]), part(process.argv[2])];
              for (let i = 0; i < 3; i++) {
                if ((a[i] || 0) !== (b[i] || 0)) process.exit((a[i] || 0) < (b[i] || 0) ? 0 : 1);
              }
              process.exit(1);
            ' "${version}" "${latest}"; then
              tag_flags=(--tag backfill)
              echo "::warning::${name}@${version} is older than the published latest (${latest}) — publishing under the 'backfill' dist-tag so 'latest' stays put."
            fi
            echo "publish ${name}@${version}"
            if ! npm publish --workspace "${name}" --access public \
              ${publish_flags[@]+"${publish_flags[@]}"} ${tag_flags[@]+"${tag_flags[@]}"}; then
              echo "::error::failed to publish ${name}@${version}"
              fail=1
            fi
          done
          exit $fail
      # The version fan-out above stays in the runner's working tree only — we
      # deliberately do NOT commit it back to main. The published packages carry
      # the correct version (set-version derives it fresh from the tagged root
      # version on every run), and the release-please manifest + git tag are the
      # source of truth. This matches the sibling repos (compose-ai-tools,
      # meshcore-mobile), whose release builds also derive the version from the
      # tag and never push to main — a direct push would violate the shared
      # "Protect Main" ruleset (PR + status checks required, no bot bypass).
