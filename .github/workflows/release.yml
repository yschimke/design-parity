name: release

# release-please drives releases. On every push to main it maintains a single
# "release PR" (one shared version + one CHANGELOG for the whole repo). Merging
# that PR makes release-please tag `vX.Y.Z`, cut the GitHub release, and — in the
# same run — publish all 15 packages to npm.
#
# IMPORTANT: this file is `release.yml` because the npm Trusted Publisher (OIDC)
# for each package is bound to this exact workflow filename. Don't rename it, or
# OIDC publishing breaks until every package's trusted publisher is reconfigured.
on:
  push:
    branches: [main]
  # Lets scheduled-merge.yml re-trigger release-please after bot merges
  # (GITHUB_TOKEN merges don't fire push workflows).
  workflow_dispatch:

permissions:
  contents: write # release-please commits/tags the release
  pull-requests: write # release-please maintains the release PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Pinned to the same v5.0.0 commit the sibling repos (compose-ai-tools,
      # meshcore-mobile) run. config-file/manifest-file are passed explicitly
      # (matching the siblings) rather than relying on default resolution.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `release_created` is only true on the single run that cuts the release.
    # When runners are backed up, a later push can execute first and create the
    # release itself; by the time the release commit's own run gets a runner,
    # release-please reports "Found release for path ., vX.Y.Z" and sets no
    # output — so publish is gated off on *every* run and the version is
    # stranded on the tag, never reaching npm. That happened to v0.1.43.
    #
    # A manual dispatch is the escape hatch (matching the sibling repo
    # compose-ai-tools, whose release.yml takes a tag input for the same
    # reason). The publish loop below already skips packages whose version is
    # on npm, so re-publishing an in-sync release is a no-op.
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      # release-please bumps the root version; fan it out to every workspace
      # package + internal dependency range before publishing. This runs in the
      # runner's working tree only and is not committed back (see the note after
      # the publish step).
      - name: Sync workspace versions to the release
        run: npm run set-version "$(node -p "require('./package.json').version")"
      - run: npm run build
      - run: npm test
      # Trusted publishing: OIDC supplies the credential (no NODE_AUTH_TOKEN),
      # provenance is automatic (no --provenance flag).
      #
      # Publish per-workspace so one failure (e.g. a brand-new package without
      # OIDC trusted-publisher yet) does not abort the rest. Treat
      # already-published versions as success so partial-publish reruns finish
      # the job. Any other publish error still fails the workflow.
      - name: Publish workspaces
        run: |
          set -u
          fail=0
          for ws in $(node -p "
            const {globSync, existsSync} = require('node:fs');
            const root = require('./package.json');
            (root.workspaces ?? [])
              .flatMap(p => globSync(p))
              .filter(d => existsSync(d + '/package.json'))
              .filter(d => !(require('./' + d + '/package.json').private))
              .join('\n')
          "); do
            name=$(node -p "require('./${ws}/package.json').name")
            version=$(node -p "require('./${ws}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already published)"
              continue
            fi
            echo "publish ${name}@${version}"
            if ! npm publish --workspace "${name}" --access public; then
              echo "::error::failed to publish ${name}@${version}"
              fail=1
            fi
          done
          exit $fail
      # The version fan-out above stays in the runner's working tree only — we
      # deliberately do NOT commit it back to main. The published packages carry
      # the correct version (set-version derives it fresh from the tagged root
      # version on every run), and the release-please manifest + git tag are the
      # source of truth. This matches the sibling repos (compose-ai-tools,
      # meshcore-mobile), whose release builds also derive the version from the
      # tag and never push to main — a direct push would violate the shared
      # "Protect Main" ruleset (PR + status checks required, no bot bypass).
