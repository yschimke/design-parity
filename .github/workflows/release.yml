name: release

# Publish the whole `@design-parity/*` scope and the top-level `design-parity`
# CLI to npm at one shared version. Tag the release commit `vX.Y.Z` and push the
# tag (the version in package.json must already match — run
# `npm run set-version X.Y.Z`, commit, then tag). The job rebuilds from a clean
# checkout and publishes every non-private workspace.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. Each package must
# have a trusted publisher configured on npmjs.com (org/user + this repo +
# workflow file `release.yml`) BEFORE its first OIDC publish, and a package's
# initial version cannot be published over OIDC, so bootstrap each new package
# once with a manual `npm publish` (see AGENTS.md → Releasing). Provenance is
# generated automatically under trusted publishing.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack each workspace without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package version $pkg — run 'npm run set-version $tag', commit, then re-tag"
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --workspaces --access public --dry-run
      # Trusted publishing: OIDC supplies the credential (no NODE_AUTH_TOKEN) and
      # provenance is automatic (no --provenance flag).
      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: npm publish --workspaces --access public
