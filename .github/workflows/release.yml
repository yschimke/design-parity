name: release

# release-please drives releases. On every push to main it maintains a single
# "release PR" (one shared version + one CHANGELOG for the whole repo). Merging
# that PR makes release-please tag `vX.Y.Z`, cut the GitHub release, and — in the
# same run — publish all 14 packages to npm.
#
# IMPORTANT: this file is `release.yml` because the npm Trusted Publisher (OIDC)
# for each package is bound to this exact workflow filename. Don't rename it, or
# OIDC publishing breaks until every package's trusted publisher is reconfigured.
on:
  push:
    branches: [main]

permissions:
  contents: write # release-please commits/tags; publish job pushes the version sync
  pull-requests: write # release-please maintains the release PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      # release-please bumps the root version; fan it out to every workspace
      # package + internal dependency range before publishing.
      - name: Sync workspace versions to the release
        run: npm run set-version "$(node -p "require('./package.json').version")"
      - run: npm run build
      - run: npm test
      # Trusted publishing: OIDC supplies the credential (no NODE_AUTH_TOKEN),
      # provenance is automatic (no --provenance flag).
      - run: npm publish --workspaces --access public
      - name: Commit the version sync back to main
        run: |
          if ! git diff --quiet; then
            v="$(node -p "require('./package.json').version")"
            git -c user.name='Yuri Schimke' -c user.email='yuri@schimke.ee' \
              commit -am "chore: sync workspace versions to v$v [skip ci]"
            git push origin HEAD:main
          fi
