name: UID parity (reusable)

# Deterministic UID reference / Compose candidate evidence. Model auditing is a
# separate opt-in workflow in compose-ai-tools; it does not decide parity.
# See docs/UID_PARITY_CI.md for the caller contract and artifact names.
on:
  workflow_call:
    inputs:
      pilot-directory:
        description: Directory containing references.json, UID documents and build/pilot.
        type: string
        required: true
      bundle-name:
        description: Output zip basename (without extension).
        type: string
        default: screens
      build-command:
        description: Caller-owned command that checks interactions and writes build/pilot/previews.
        type: string
        required: true
      artifact-prefix:
        description: Unique prefix per invocation in a workflow run; share it with the audit evidence-artifact.
        type: string
        default: adaptive-uid
      publish-catalog:
        description: Export a catalog on PRs and publish it from the default branch (requires contents write).
        type: boolean
        default: false
      java-version:
        description: JDK used for the app candidate build (the UID renderer has its own pinned image).
        type: string
        default: 21.0.12+101.0.LTS

permissions:
  contents: read

env:
  PILOT_DIR: ${{ inputs.pilot-directory }}
  BUNDLE_NAME: ${{ inputs.bundle-name }}
  ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check interactions and render candidate matrix
        # This is trusted executable configuration, not untrusted PR metadata.
        # Environment transport preserves the command text; it does not sanitize it.
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash --noprofile --norc -e -o pipefail -c "$BUILD_COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-candidates
          path: ${{ inputs.pilot-directory }}/build/pilot/previews/
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-tests
          path: ${{ inputs.pilot-directory }}/build/reports/tests/
          overwrite: true
          if-no-files-found: warn

  references:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # v3.117.0, including native renderer, Kotlin compiler and Skiko sidecars.
      image: ghcr.io/yschimke/compose-preview-host@sha256:7049b567e962db6a4e26d46585273cb39295b8d0924563e837fc5d20234eabb1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-preview-server
          ref: 091600e10ea5579b944f59be2d216aac2a62e0ea
          path: _preview_server
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Render committed UID references independently
        run: |
          set +e
          sh _preview_server/scripts/ui-builder/render-ci-references.sh "$PILOT_DIR" > native-reference.log 2>&1
          result=$?
          cat native-reference.log
          if [ "$result" -ne 0 ]; then
            node -e 'const fs = require("fs"); const message = fs.readFileSync("native-reference.log", "utf8").slice(-8000).replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"); console.log("::error::" + message)'
          fi
          exit "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-references
          path: ${{ inputs.pilot-directory }}/build/pilot/references/
          overwrite: true
          if-no-files-found: error

  compare:
    needs: [candidate, references]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: 8f920cb830b42e9e5ed25eeed4aa7145896922c3
          path: _uid_tools
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-candidates
          path: ${{ inputs.pilot-directory }}/build/pilot/previews
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-references
          path: ${{ inputs.pilot-directory }}/build/pilot/references
      - name: Produce pixel diffs and validate bundle
        run: |
          python _uid_tools/scripts/uid/evidence.py --plan "$PILOT_DIR/references.json" --root "$PILOT_DIR/build/pilot"
          python _uid_tools/scripts/uid/package.py --pilot-directory "$PILOT_DIR" --output "$PILOT_DIR/build/$BUNDLE_NAME.zip"
          printf 'Download %s-evidence and open index.html: UID reference, exact pixel diff, Compose actual. Changed pixels are advisory; missing or invalid evidence fails this job.\n' "$ARTIFACT_PREFIX" >> "$GITHUB_STEP_SUMMARY"
          cat "$PILOT_DIR/build/pilot/evidence.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-evidence
          path: ${{ inputs.pilot-directory }}/build/pilot/
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-bundle
          path: ${{ inputs.pilot-directory }}/build/*.zip
          overwrite: true
          if-no-files-found: error


  catalog:
    if: inputs.publish-catalog
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: 48bff2220cd224490448134bc984aea80ef15b82
          path: _uid_tools
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build canonical catalog exporter
        working-directory: _uid_tools
        run: |
          npm ci --ignore-scripts
          npm run build --workspace @design-parity/core
          npm run build --workspace @design-parity/catalog-export
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-evidence
          path: _evidence
      - name: Export candidate catalog with UID references
        run: |
          node _uid_tools/packages/export-driver/publish-uid-catalog.mjs \
            --plan "$PILOT_DIR/references.json" --root _evidence --out _catalog --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-catalog
          path: _catalog/
          overwrite: true
          if-no-files-found: error

  publish:
    needs: catalog
    if: >-
      inputs.publish-catalog &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No app checkout or app scripts in the job that can write the delivery branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 5765a5ac041e2b7911c0c678db74be50c67ce400
          path: _publisher
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/design-parity
          ref: 48bff2220cd224490448134bc984aea80ef15b82
          path: _uid_tools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-catalog
          path: _catalog
      - name: Publish delivery branch with the shared catalog publisher
        working-directory: _catalog
        env:
          GITHUB_TOKEN_INLINE: ${{ github.token }}
          REPO: ${{ github.repository }}
          GIT_AUTHOR_NAME: Yuri Schimke
          GIT_AUTHOR_EMAIL: yuri@schimke.ee
          GIT_COMMITTER_NAME: Yuri Schimke
          GIT_COMMITTER_EMAIL: yuri@schimke.ee
        run: |
          SYSTEM=$(node -e 'const c = require("./catalog.json"); if (!/^[a-z0-9][a-z0-9-]*$/.test(c.system)) throw new Error("Invalid catalog system"); process.stdout.write(c.system)')
          export TARGET_BRANCH="design-artifacts/$SYSTEM"
          export MSG="chore(design-artifacts): publish $SYSTEM from $GITHUB_SHA"
          export SKIP_IF_UNCHANGED=1
          export CARRY_FORWARD_PATHS="parity/issues.json history.json"
          export REVISION_PREVIEW_INDEX=1
          export DRIVER_DIR="$GITHUB_WORKSPACE/_uid_tools/packages/export-driver"
          bash "$GITHUB_WORKSPACE/_publisher/.github/actions/apply/lib/push-branch.sh"
          printf 'Published UID-backed catalog to [%s](https://github.com/%s/tree/%s).\n' "$TARGET_BRANCH" "$REPO" "$TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"
