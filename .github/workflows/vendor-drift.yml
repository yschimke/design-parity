name: vendor drift

# The blocking half of this lives in `npm test`: `vendor-provenance.test.ts` proves the vendored
# engine is `compose-ai-tools` at the pinned commit, offline and hermetically. What it deliberately
# cannot see is upstream *moving* — the pin stays honest while going stale.
#
# So this job watches for that, and only reports. Re-vendoring is a deliberate act: it lands a new
# scoring kernel, and every published score can move with it. Failing every PR because upstream
# merged something would train people to ignore the signal that matters.

on:
  schedule:
    # Mondays, ahead of the week's work rather than during it.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-drift
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      # The sync imports `vendor-archive.mjs`, which imports `fflate`. `checkout` and `setup-node`
      # install nothing, so without this the script dies with ERR_MODULE_NOT_FOUND on every run.
      - run: npm ci
      - name: Fetch upstream
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/yschimke/compose-ai-tools.git /tmp/compose-ai-tools
      - name: Re-vendor against upstream main
        id: sync
        run: |
          # A *failed* sync is drift too, and the loudest kind: the script refuses to write when a
          # vendored module has been renamed or removed upstream, or when the pinned commit is no
          # longer reachable. Letting the step die here would fail the job before `behind` is set,
          # so the one case that most needs a report would produce silence instead.
          set +e
          node packages/diff/test/sync-known-differences-vendor.mjs \
            /tmp/compose-ai-tools origin/main > /tmp/sync.log 2>&1
          status=$?
          set -e
          # Exit 3 is the script *refusing* — a vendored module gone from upstream, a pin no longer
          # reachable. That is drift, and the loudest kind, so it goes in the report. Any other
          # non-zero status is a broken job (a missing dependency, a runner without git), and must
          # fail loudly rather than masquerade as a stale pin: a setup error that opens a drift
          # issue every week teaches everyone to ignore the one week it is real.
          if [ "$status" -eq 3 ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            {
              echo 'diff<<DRIFT'
              echo 'The re-vendor could not complete. This is drift the sync refuses to paper over:'
              echo
              tail -n 20 /tmp/sync.log
              echo DRIFT
            } >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "The sync failed for a reason that is not drift:" >&2
            cat /tmp/sync.log >&2
            exit "$status"
          fi
          # Compare the *content*, not the record. `PROVENANCE.json` carries the upstream commit, so
          # it is rewritten every time upstream `main` advances at all — including for changes that
          # touch nothing this package vendors. Diffing the whole directory would therefore raise a
          # drift issue with an empty module diff on most weeks, and a report that cries wolf is a
          # report nobody reads. The vendored modules and the corpus archive are the pin that
          # actually matters.
          if git diff --quiet -- \
              packages/diff/src/acceptance/vendor/'*.ts' \
              packages/diff/test/fixtures/known-differences.zip; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
            {
              echo 'diff<<DRIFT'
              git diff --stat -- \
                packages/diff/src/acceptance/vendor/'*.ts' \
                packages/diff/test/fixtures/known-differences.zip
              echo DRIFT
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Summarise
        run: |
          if [ "${{ steps.sync.outputs.behind }}" = "true" ]; then
            echo "The vendored engine is behind upstream \`main\`." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.sync.outputs.diff }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The vendored engine matches upstream \`main\`." >> "$GITHUB_STEP_SUMMARY"
          fi
      # One issue, reopened and re-bodied rather than a new one each Monday — the drift is a
      # standing condition, not a weekly event, and a pile of duplicates is how a signal dies.
      - name: Report
        if: steps.sync.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.sync.outputs.diff }}
        run: |
          title='chore(diff): the vendored known-differences engine is behind upstream'
          {
            printf '%s\n' 'The scheduled check re-vendored `packages/diff/src/acceptance/vendor` from'
            printf '%s\n' '[`compose-ai-tools@main`](https://github.com/yschimke/compose-ai-tools/tree/main/scripts/design-artifacts)'
            printf '%s\n\n' 'and the result differs from what is committed here.'
            printf '%s\n' '```'
            printf '%s\n' "$DRIFT"
            printf '%s\n\n' '```'
            printf '%s\n\n' 'To bring it forward, against a checkout of `compose-ai-tools`:'
            printf '%s\n' '```sh'
            printf '%s\n' 'node packages/diff/test/sync-known-differences-vendor.mjs <compose-ai-tools-checkout>'
            printf '%s\n' 'node packages/diff/test/sync-known-differences-fixtures.mjs <compose-ai-tools-checkout>'
            printf '%s\n' 'npm test'
            printf '%s\n\n' '```'
            printf '%s\n' 'Re-vendor the fixtures alongside the engine: a kernel change moves the expected scores in'
            printf '%s\n\n' 'the conformance corpus, and the two are only meaningful pinned to the same commit.'
            printf '%s\n' 'This is a report, not a failure — re-vendoring changes published scores and is a decision,'
            printf '%s\n' 'not routine maintenance.'
          } > /tmp/drift-body.md
          existing=$(gh issue list --state all --search "$title in:title" \
            --json number,state --jq '.[0] | select(.) | "\(.number) \(.state)"')
          if [ -n "$existing" ]; then
            number=${existing%% *}
            state=${existing##* }
            [ "$state" = "CLOSED" ] && gh issue reopen "$number"
            gh issue edit "$number" --body-file /tmp/drift-body.md
          else
            gh issue create --title "$title" --body-file /tmp/drift-body.md
          fi
      # Drift is a *condition*, so the issue has to end when the condition does. Without this the
      # report opened on a stale week stays open forever, still asserting the engine differs from
      # upstream long after someone re-vendored — and a standing issue that is no longer true is
      # indistinguishable from one nobody got round to.
      - name: Stand down
        if: steps.sync.outputs.behind == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='chore(diff): the vendored known-differences engine is behind upstream'
          open=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" \
              --comment 'The vendored engine matches upstream `main` again — closed by the scheduled check.'
          fi
