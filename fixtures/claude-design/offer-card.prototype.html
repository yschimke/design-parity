<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offer Card — prototype</title>
<style>
  :root { color-scheme: light }
  * { box-sizing: border-box }
  html, body { margin: 0 }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f8;
    color: #161d1b;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e2e2ea;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #645aff;
    background: #ecebff;
    padding: 3px 10px;
    border-radius: 999px;
  }
  h1 { margin: 12px 0 4px; font-size: 20px }
  p.desc { margin: 0 0 16px; color: #55555f }
  .cta {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    font: inherit;
    font-weight: 600;
    color: #ffffff;
    background: #645aff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <!--
    A minimal clickable Claude Design-style prototype, committed as the golden
    input for the adapter-claude-design live-render path (design-parity #85).
    The live renderer drives this in a browser and captures it per viewport.
  -->
  <div class="card">
    <span class="badge">Limited offer</span>
    <h1>Annual plan</h1>
    <p class="desc">Two months free when you switch to yearly billing.</p>
    <button class="cta" type="button">Claim offer</button>
  </div>
</body>
</html>
